services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # We mount the .env file explicitly so the container can access the database/R2 secrets
    env_file: ./backend/.env
    ports:
      # Bind to localhost only so it's not exposed to the public internet.
      # Caddy on the host will use `reverse_proxy 127.0.0.1:8000`
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    # Healthchecks ensure Docker knows if the API actually started successfully.
    # /api/health does not query the database on purpose: polling a DB-backed
    # route every 30s keeps Neon awake around the clock and exhausts its quota.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
