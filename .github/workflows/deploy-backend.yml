name: Deploy Backend

on:
  push:
    branches:
      - main
  # Manual run from the Actions tab. Deploys the tip of main.
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Oracle Server
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_DIR: /srv/portfolio
      DEPLOY_SHA: ${{ github.sha }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}

    steps:
      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          # Fail with a clear message if a secret is missing, naming it but never printing it.
          missing=0
          for name in SERVER_SSH_KEY SERVER_KNOWN_HOSTS SERVER_HOST SERVER_USER; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy and verify
        run: |
          set -euo pipefail

          # The remote commands are passed as an argument and ssh's stdin is
          # closed. Do NOT go back to piping a script into ssh: `docker compose
          # run` reads stdin and swallowed everything after the migration step,
          # so the container was never recreated while this job reported
          # success. The real work is in scripts/deploy-backend.sh, which runs
          # from the checkout it has just updated.
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            "${SERVER_USER}@${SERVER_HOST}" \
            "cd '${DEPLOY_DIR}' && git fetch --quiet origin main && git reset --hard --quiet '${DEPLOY_SHA}' && bash scripts/deploy-backend.sh '${DEPLOY_SHA}'" \
            < /dev/null 2>&1 | tee deploy.log

          # Second line of defence: the script prints this line only after it
          # has verified the new container. If the script ever ends early again
          # with a zero exit code, this still fails the job.
          if ! grep -qx "DEPLOY_OK ${DEPLOY_SHA}" deploy.log; then
            echo "::error::The deploy script ended without confirming the new container. Treating this deployment as failed."
            exit 1
          fi

          {
            echo "### Backend deployed"
            echo '```'
            grep -E '^(Deployed commit|Running image|Running container):' deploy.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
